<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hospital Hero</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      width: 100%;
      height: 100%;
      max-width: 960px;
      max-height: 540px;
      position: relative;
      background-color: #000;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    #background-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
      transition: background-image 0.3s ease-in-out;
    }

    #hotspots-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* Hotspot Base */
    .hotspot-btn {
      position: absolute;
      transform: translate(-50%, -100%);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.2s ease;
      animation: floatPulse 2.5s infinite ease-in-out;
    }

    /* Character Pins */
    .character-btn {
      background: rgba(2, 132, 199, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 14px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 700;
      opacity: 0.9;
    }

    .character-btn.main-player {
      background: rgba(147, 51, 234, 0.7);
      border-color: rgba(233, 213, 255, 0.9);
    }

    .character-btn.interacted {
      background: rgba(16, 185, 129, 0.75);
      border-color: rgba(167, 243, 208, 0.9);
    }

    /* Info ("i") Hotspots */
    .info-btn {
      background: rgba(234, 88, 12, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      opacity: 0.9;
    }

    .info-btn.interacted {
      background: rgba(16, 185, 129, 0.85);
      border-color: rgba(167, 243, 208, 0.9);
    }

    .hotspot-btn:hover, .hotspot-btn:active {
      opacity: 1;
      transform: translate(-50%, -108%) scale(1.1);
    }

    @keyframes floatPulse {
      0%, 100% { transform: translate(-50%, -100%) scale(0.98); }
      50% { transform: translate(-50%, -105%) scale(1.04); }
    }

    /* UI Overlay Elements */
    .ui-overlay {
      position: relative;
      z-index: 20;
      pointer-events: none;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
    }

    .top-bar {
      pointer-events: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .badge-pill {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      color: #0369a1;
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* Testing Shortcut Dropdown */
    .room-select-dropdown {
      background: rgba(15, 23, 42, 0.85);
      color: #38bdf8;
      border: 1.5px solid #0284c7;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .room-select-dropdown option {
      background: #0f172a;
      color: #ffffff;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .quiz-trigger-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      border: 1.5px solid #fef08a;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(217, 119, 6, 0.4);
      animation: pulseGlow 1.5s infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: scale(1); box-shadow: 0 0 4px #f59e0b; }
      to { transform: scale(1.05); box-shadow: 0 0 12px #f59e0b; }
    }

    /* Speech & Modals */
    .dialogue-modal {
      pointer-events: auto;
      align-self: center;
      margin-top: auto;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(2, 132, 199, 0.3);
      border-radius: 14px;
      padding: 12px 16px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      position: relative;
      animation: fadeIn 0.2s ease-out;
    }

    .dialogue-modal.player-bubble {
      background: rgba(250, 245, 255, 0.94);
      border-color: rgba(147, 51, 234, 0.4);
    }

    .dialogue-modal.player-bubble h4 { color: #7e22ce; }

    .dialogue-modal h4 {
      font-size: 11px;
      color: #0284c7;
      text-transform: uppercase;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .dialogue-modal p {
      font-size: 13px;
      color: #0f172a;
      font-weight: 500;
      line-height: 1.4;
      padding-right: 16px;
    }

    .name-edit-container {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .inline-name-input {
      background: rgba(147, 51, 234, 0.1);
      border: 1.5px solid rgba(147, 51, 234, 0.5);
      border-radius: 8px;
      color: #6b21a8;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 700;
      width: 110px;
      outline: none;
    }

    .save-name-btn, .choice-btn {
      background: #7e22ce;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .choice-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .choice-btn {
      background: #0284c7;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.2;
    }

    .choice-btn:hover { background: #0369a1; }

    /* Overlay Fullscreen Cards (Quiz & Room Transition) */
    .card-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .card-content {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      width: 88%;
      max-width: 420px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .card-content h3 {
      font-size: 16px;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .card-content p {
      font-size: 13px;
      color: #475569;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .quiz-opt-btn {
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .quiz-opt-btn:hover {
      background: #e2e8f0;
      border-color: #0284c7;
    }

    .primary-btn {
      background: #10b981;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.3);
    }

    .primary-btn:hover { background: #059669; }

    .close-btn {
      position: absolute;
      top: 6px;
      right: 10px;
      background: none;
      border: none;
      font-size: 18px;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
    }

    .close-btn:hover { color: #0f172a; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="background-layer"></div>
    <div id="hotspots-layer"></div>

    <div class="ui-overlay">
      <div class="top-bar">
        <div id="room-badge" class="badge-pill">🏥 Room Title</div>
        
        <select id="test-room-select" class="room-select-dropdown" onchange="jumpToRoom(this.value)">
          <option value="waiting">⚡ Jump: Waiting Room</option>
          <option value="gp">⚡ Jump: GP Consultation</option>
          <option value="ambulance">⚡ Jump: Ambulance</option>
        </select>

        <div class="top-actions">
          <div id="progress-badge" class="badge-pill">Explored: 0/0</div>
          <button id="quiz-btn" class="quiz-trigger-btn hidden" onclick="startQuiz()">📝 Take Quiz</button>
        </div>
      </div>

      <div id="dialogue-box" class="dialogue-modal hidden">
        <button class="close-btn" onclick="closeDialogue()">&times;</button>
        <h4 id="speaker-name">Name</h4>
        <p id="speaker-text">Text content</p>
        
        <div id="player-name-editor" class="name-edit-container hidden">
          <input type="text" id="inline-name-input" class="inline-name-input" value="Emilia" placeholder="Enter Name">
          <button class="save-name-btn" onclick="savePlayerName()">Set Name</button>
        </div>

        <div id="dialogue-choices" class="choice-container hidden"></div>
      </div>
    </div>

    <div id="quiz-modal" class="card-overlay hidden">
      <div class="card-content">
        <h3 id="quiz-title">Room Knowledge Quiz</h3>
        <p id="quiz-question">Question text...</p>
        <div id="quiz-options" class="quiz-options"></div>
        <p id="quiz-feedback" style="font-weight:700; min-height:18px; margin-bottom:8px;"></p>
      </div>
    </div>

    <div id="transition-modal" class="card-overlay hidden">
      <div class="card-content">
        <h3 id="trans-title">🎉 Quiz Passed!</h3>
        <p id="trans-text">You have mastered this room's medical knowledge.</p>
        <button id="trans-action-btn" class="primary-btn" onclick="changeRoom('gp')">Proceed to Next Station</button>
      </div>
    </div>
  </div>

  <script>
    let playerName = "Emilia";
    let currentRoomId = "waiting";
    let activeChar = null;
    let npcStep = 0;

    // Room Datasets & Dynamic Interactive Nodes
    const rooms = {
      waiting: {
        title: "🏥 Hospital Waiting Room",
        image: "assets/Gemini_Generated_Image_cpr3etcpr3etcpr3.jpg",
        nextRoom: "gp",
        nextRoomTitle: "GP Consultation Room",
        nodes: [
          { id: "w_player", type: "char", isPlayer: true, name: "Player", x: "45.5%", y: "20%", text: "Hi everyone! I'm {PLAYER}, checking in for my appointment today." },
          { id: "w_orderly", type: "char", name: "Orderly", x: "7.5%", y: "48%", text: "Hello, {PLAYER}! I keep the lobby clean and sanitize seats to stop germs from spreading." },
          { id: "w_recept", type: "char", name: "Receptionist", x: "19%", y: "45%", text: "Welcome {PLAYER}! We confirm patient details here so your medical chart is perfectly accurate." },
          { id: "w_doc", type: "char", name: "Doctor", x: "45.5%", y: "50%", text: "Good day, {PLAYER}! I'm reviewing patient files before calling my next appointment in." },
          { id: "w_nurse1", type: "char", name: "Nurse (Clipboard)", x: "66%", y: "19%", text: "Hi {PLAYER}! Checking vitals early helps us identify urgent health needs faster." },
          { id: "w_nurse2", type: "char", name: "Triage Nurse", x: "65%", y: "68%", text: "Hello {PLAYER}! Triage prioritizes patients based on how severe their symptoms are." },
          { id: "w_senior", type: "char", name: "Senior Patient", x: "75%", y: "26%", text: "Nice to meet you, {PLAYER}! Resting calmly keeps blood pressure steady while waiting." },
          { id: "w_patient_sling", type: "char", name: "Patient with Sling", x: "84%", y: "29%", text: "Hi {PLAYER}! My arm sling immobilizes bone joints so injured tissues heal correctly." },
          { id: "w_child", type: "char", name: "Waiting Child", x: "53%", y: "16%", text: "Hi {PLAYER}! Wearing clean clothes and washing hands keeps clinic spaces safe for everyone." },
          { id: "w_dog", type: "char", name: "Therapy Dog", x: "58%", y: "66%", text: "Woof! *Therapy dogs reduce patient stress and lower anxiety levels in hospital lobbies!*" },
          
          // Info ("i") Points
          { id: "w_i_sanitizer", type: "info", title: "Hand Sanitizer Station", x: "30%", y: "42%", text: "INFO: Sanitizing hands with alcohol rub kills 99.9% of routine germs instantly." },
          { id: "w_i_board", type: "info", title: "Information Notice Board", x: "92%", y: "22%", text: "INFO: Notice boards inform patients about seasonal flu shots and hygiene policies." }
        ],
        quiz: [
          {
            q: "What is the primary role of Triage in a clinic waiting area?",
            opts: ["To sell medications", "To prioritize patients by severity of symptoms", "To book future holidays"],
            ans: 1
          },
          {
            q: "Why is hand sanitizer used throughout waiting rooms?",
            opts: ["To kill germs and prevent cross-contamination", "To clean shoes", "To scent the room"],
            ans: 0
          },
          {
            q: "Why is it important for receptionists to double-check patient details?",
            opts: ["To ensure medical charts are accurate", "To collect entry fees", "To test handwriting"],
            ans: 0
          },
          {
            q: "What is the main benefit of having therapy dogs in hospital lobbies?",
            opts: ["To guard the main doors", "To reduce patient stress and anxiety", "To entertain the medical staff"],
            ans: 1
          },
          {
            q: "Why is an arm sling used for an upper limb injury?",
            opts: ["To immobilize bone joints for safe healing", "To keep the arm warm", "To hide the injury"],
            ans: 0
          }
        ]
      },
      gp: {
        title: "👨‍⚕️ GP Consultation Room",
        image: "assets/Gemini_Generated_Image_8xr0rp8xr0rp8xr0.jpg",
        nextRoom: "ambulance",
        nextRoomTitle: "Emergency Ambulance",
        nodes: [
          { id: "gp_dr", type: "char", isInteractiveTree: "dr", name: "Dr. Smith (GP)", x: "19%", y: "45%", text: "Welcome in, {PLAYER}! Take a seat. How can I help you today?" },
          
          // Info ("i") Points inside Consultation Room
          { id: "gp_i_chart", type: "info", title: "Anatomy Chart", x: "75%", y: "10%", text: "INFO: Visual anatomy charts help doctors explain organ functions and health conditions to patients." },
          { id: "gp_i_trolley", type: "info", title: "Medical Equipment Trolley", x: "70%", y: "48%", text: "INFO: Holds diagnostic tools like blood pressure cuffs (sphygmomanometers) and stethoscopes." },
          { id: "gp_i_scale", type: "info", title: "Weight Scale", x: "76%", y: "85%", text: "INFO: Measuring body weight and BMI assists GPs in monitoring physical growth and dosage accuracy." },
          { id: "gp_i_cabinet", type: "info", title: "Medicine Cabinet", x: "56%", y: "16%", text: "INFO: Locked medical cabinets securely store prescription medications and antiseptic supplies." },
          { id: "gp_i_poster", type: "info", title: "Health Bulletins", x: "11%", y: "24%", text: "INFO: Educational posters teach patients about balanced nutrition, vaccines, and wellness." }
        ],
        quiz: [
          {
            q: "What instrument on the equipment trolley measures blood pressure?",
            opts: ["Stethoscope", "Sphygmomanometer", "Thermometer"],
            ans: 1
          },
          {
            q: "Why are anatomy charts used during consultation?",
            opts: ["For decoration", "To visually explain health conditions to patients", "To test patient eyesight"],
            ans: 1
          },
          {
            q: "What medical tool does a doctor use to listen to heart and lung sounds?",
            opts: ["Stethoscope", "Otoscope", "Sphygmomanometer"],
            ans: 0
          },
          {
            q: "Why do doctors monitor body weight and BMI on a scale?",
            opts: ["To choose gym memberships", "To monitor physical growth and dosage accuracy", "To compare patients"],
            ans: 1
          },
          {
            q: "Why are prescription medicine cabinets kept locked in consultation rooms?",
            opts: ["To prevent medication spoilage", "To securely store prescriptions and keep patients safe", "To save cabinet space"],
            ans: 1
          }
        ]
      },
      ambulance: {
        title: "🚑 Emergency Ambulance Unit",
        image: "assets/Gemini_Generated_Image_5vfx3o5vfx3o5vfx.jpg",
        nextRoom: "waiting",
        nextRoomTitle: "Hospital Waiting Room",
        nodes: [
          { id: "amb_paramedic", type: "char", isInteractiveTree: "paramedic", name: "Paramedic Sam", x: "44%", y: "78%", text: "Hi {PLAYER}! I'm Paramedic Sam. Welcome aboard our mobile emergency unit!" },
          { id: "amb_player", type: "char", isPlayer: true, name: "Player", x: "28%", y: "78%", text: "Hi Sam! Wow, there are so many life-saving tools inside this ambulance!" },
          
          // Info ("i") Points inside Ambulance
          { id: "amb_i_stretcher", type: "info", title: "Ambulance Stretcher Bed", x: "42%", y: "52%", text: "INFO: The wheeled stretcher safely secures and transports patients comfortably into emergency care." },
          { id: "amb_i_oxygen", type: "info", title: "Oxygen Cylinder Unit", x: "33%", y: "38%", text: "INFO: Supplies compressed oxygen to support patients experiencing difficulty breathing or respiratory trauma." },
          { id: "amb_i_defib", type: "info", title: "ECG Defibrillator Monitor", x: "39%", y: "35%", text: "INFO: Monitors heart rhythm and can deliver electrical shocks to restore normal cardiac rhythms in emergencies." },
          { id: "amb_i_shelves", type: "info", title: "Emergency Supply Shelves", x: "38%", y: "16%", text: "INFO: Contains sterile IV fluids, bandages, splints, and emergency medications for rapid access on scene." },
          { id: "amb_i_firstaid", type: "info", title: "First Aid Kit & Trauma Bags", x: "47%", y: "34%", text: "INFO: Portable trauma kits allow paramedics to carry essential life-support equipment directly to casualties." }
        ],
        quiz: [
          {
            q: "What is the primary purpose of an ECG Defibrillator inside an ambulance?",
            opts: ["To measure body temperature", "To monitor heart rhythm and deliver shocks during cardiac emergencies", "To check blood sugar levels"],
            ans: 1
          },
          {
            q: "Why do ambulances carry compressed Oxygen Cylinders?",
            opts: ["To inflate tires", "To assist patients who have severe difficulty breathing", "To keep the ambulance cool"],
            ans: 1
          },
          {
            q: "How does a portable Trauma Bag assist paramedics?",
            opts: ["It carries essential emergency kit directly to injured people on scene", "It holds the paramedic's personal lunch", "It cleans the ambulance floor"],
            ans: 0
          },
          {
            q: "What is the main function of the ambulance stretcher?",
            opts: ["To serve as a seat for paramedics", "To safely hold and transport patients comfortably", "To store extra medical boxes"],
            ans: 1
          },
          {
            q: "Why are ambulance supply shelves organized and labelled clearly?",
            opts: ["For fast, immediate access to critical life-saving items during urgent transport", "To look nice for photos", "To store old medical records"],
            ans: 0
          }
        ]
      }
    };

    let interactedNodes = new Set();
    let currentQuizIndex = 0;
    let quizScore = 0;

    // Interactive Dialogue Decision Trees
    const dialogueTrees = {
      dr: [
        {
          speaker: "Dr. Smith (GP)",
          text: "Welcome in, {PLAYER}! Take a seat. How can I help you today?",
          choices: [
            { label: "I want to learn about health checkups.", next: 1 },
            { label: "What tools do you use here?", next: 2 }
          ]
        },
        {
          speaker: "Dr. Smith (GP)",
          text: "Regular checkups help us spot health changes early. We measure heart rate, blood pressure, and review habits!",
          choices: [
            { label: "That makes sense! What about medical tools?", next: 2 },
            { label: "Thanks Dr. Smith, I understand!", next: 3 }
          ]
        },
        {
          speaker: "Dr. Smith (GP)",
          text: "I use a stethoscope to listen to lungs & heart beats, and the trolley equipment to check vital stats.",
          choices: [
            { label: "Great! Thanks for explaining everything.", next: 3 }
          ]
        },
        {
          speaker: "Dr. Smith (GP)",
          text: "You're very welcome, {PLAYER}! Feel free to inspect the anatomical chart and tools in the room.",
          choices: []
        }
      ],
      paramedic: [
        {
          speaker: "Paramedic Sam",
          text: "Hi {PLAYER}! I'm Paramedic Sam. We respond quickly whenever someone needs urgent medical care!",
          choices: [
            { label: "What happens when you receive an emergency call?", next: 1 },
            { label: "What kind of equipment is inside the ambulance?", next: 2 }
          ]
        },
        {
          speaker: "Paramedic Sam",
          text: "We turn on our blue lights and sirens so traffic moves aside, allowing us to reach patients as fast as possible!",
          choices: [
            { label: "That's incredible! What tools do you carry onboard?", next: 2 },
            { label: "How do you help patients on the way to hospital?", next: 3 }
          ]
        },
        {
          speaker: "Paramedic Sam",
          text: "We have oxygen tanks, heart defibrillators, splints, and trauma bags right behind us in these cabinets!",
          choices: [
            { label: "How do you care for patients while driving?", next: 3 }
          ]
        },
        {
          speaker: "Paramedic Sam",
          text: "One paramedic drives safely while the other stays in back monitoring vitals and administering medicine on the stretcher!",
          choices: [
            { label: "Thank you Sam! I'm going to inspect the ambulance now.", next: 4 }
          ]
        },
        {
          speaker: "Paramedic Sam",
          text: "Take a look around, {PLAYER}! Feel free to inspect the oxygen cylinder, stretcher, and defibrillator!",
          choices: []
        }
      ]
    };

    function loadRoom(roomId) {
      currentRoomId = roomId;
      interactedNodes.clear();
      activeChar = null;
      npcStep = 0;

      const room = rooms[roomId];
      document.getElementById('room-badge').innerText = room.title;
      document.getElementById('background-layer').style.backgroundImage = `url('${room.image}')`;
      
      // Update testing dropdown synchronization
      const dropdown = document.getElementById('test-room-select');
      if (dropdown) dropdown.value = roomId;

      closeDialogue();
      updateProgress();
      renderHotspots();
    }

    function jumpToRoom(targetRoomId) {
      if (rooms[targetRoomId]) {
        loadRoom(targetRoomId);
      }
    }

    function renderHotspots() {
      const container = document.getElementById('hotspots-layer');
      container.innerHTML = '';
      const room = rooms[currentRoomId];

      room.nodes.forEach(node => {
        const btn = document.createElement('button');
        const isInteracted = interactedNodes.has(node.id);

        if (node.type === 'char') {
          btn.className = `hotspot-btn character-btn ${node.isPlayer ? 'main-player' : ''} ${isInteracted ? 'interacted' : ''}`;
          if (node.isPlayer) {
            btn.id = 'player-btn';
            btn.innerHTML = `⭐ ${playerName}`;
          } else {
            btn.innerHTML = `💬 ${node.name}`;
          }
        } else {
          btn.className = `hotspot-btn info-btn ${isInteracted ? 'interacted' : ''}`;
          btn.innerHTML = `i`;
        }

        btn.style.left = node.x;
        btn.style.top = node.y;

        btn.onclick = (e) => {
          e.stopPropagation();
          interactedNodes.add(node.id);
          updateProgress();
          btn.classList.add('interacted');

          if (node.isInteractiveTree) {
            startNpcConversation(node.isInteractiveTree);
          } else {
            const displayName = node.isPlayer ? `${playerName} (Main Character)` : (node.name || node.title);
            showSpeech(displayName, node.text, node.isPlayer, false);
          }
        };

        container.appendChild(btn);
      });
    }

    function updateProgress() {
      const room = rooms[currentRoomId];
      // Filter out player node so clicking main player is not required to unlock quiz
      const requiredNodes = room.nodes.filter(n => !n.isPlayer);
      const totalRequired = requiredNodes.length;
      
      const interactedRequiredCount = requiredNodes.filter(n => interactedNodes.has(n.id)).length;
      
      document.getElementById('progress-badge').innerText = `Explored: ${interactedRequiredCount}/${totalRequired}`;

      const quizBtn = document.getElementById('quiz-btn');
      if (interactedRequiredCount >= totalRequired) {
        quizBtn.classList.remove('hidden');
      } else {
        quizBtn.classList.add('hidden');
      }
    }

    function showSpeech(speaker, rawText, isPlayer = false, isChoiceActive = false) {
      const box = document.getElementById('dialogue-box');
      const editor = document.getElementById('player-name-editor');
      const choicesContainer = document.getElementById('dialogue-choices');

      const formattedText = rawText.replace(/{PLAYER}/g, playerName);

      document.getElementById('speaker-name').innerText = speaker;
      document.getElementById('speaker-text').innerText = formattedText;

      if (isPlayer) {
        box.classList.add('player-bubble');
        editor.classList.remove('hidden');
        document.getElementById('inline-name-input').value = playerName;
      } else {
        box.classList.remove('player-bubble');
        editor.classList.add('hidden');
      }

      if (!isChoiceActive) {
        choicesContainer.classList.add('hidden');
      }

      box.classList.remove('hidden');
    }

    /* Interactive Tree Dialogue Handler (Doctor & Paramedic) */
    let currentTreeKey = null;

    function startNpcConversation(treeKey) {
      currentTreeKey = treeKey;
      npcStep = 0;
      renderNpcStep();
    }

    function renderNpcStep() {
      const tree = dialogueTrees[currentTreeKey];
      const stepData = tree[npcStep];
      const choicesContainer = document.getElementById('dialogue-choices');
      choicesContainer.innerHTML = '';

      showSpeech(stepData.speaker, stepData.text, false, true);

      if (stepData.choices.length > 0) {
        choicesContainer.classList.remove('hidden');
        stepData.choices.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.innerText = c.label;
          btn.onclick = () => {
            npcStep = c.next;
            renderNpcStep();
          };
          choicesContainer.appendChild(btn);
        });
      } else {
        choicesContainer.classList.add('hidden');
      }
    }

    function savePlayerName() {
      const input = document.getElementById('inline-name-input');
      const newName = input.value.trim();
      if (newName) {
        playerName = newName;
        const playerBtn = document.getElementById('player-btn');
        if (playerBtn) playerBtn.innerHTML = `⭐ ${playerName}`;
        document.getElementById('speaker-name').innerText = `${playerName} (Main Character)`;
      }
    }

    function closeDialogue() {
      document.getElementById('dialogue-box').classList.add('hidden');
    }

    /* Quiz Logic */
    function startQuiz() {
      currentQuizIndex = 0;
      quizScore = 0;
      document.getElementById('quiz-modal').classList.remove('hidden');
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const room = rooms[currentRoomId];
      const qData = room.quiz[currentQuizIndex];
      
      document.getElementById('quiz-title').innerText = `${room.title} - Quiz (${currentQuizIndex + 1}/${room.quiz.length})`;
      document.getElementById('quiz-question').innerText = qData.q;
      document.getElementById('quiz-feedback').innerText = '';

      const optsContainer = document.getElementById('quiz-options');
      optsContainer.innerHTML = '';

      qData.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt-btn';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(idx);
        optsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selectedIdx) {
      const room = rooms[currentRoomId];
      const qData = room.quiz[currentQuizIndex];
      const feedback = document.getElementById('quiz-feedback');

      if (selectedIdx === qData.ans) {
        quizScore++;
        feedback.style.color = '#10b981';
        feedback.innerText = 'Correct!';
      } else {
        feedback.style.color = '#ef4444';
        feedback.innerText = 'Incorrect!';
      }

      setTimeout(() => {
        currentQuizIndex++;
        if (currentQuizIndex < room.quiz.length) {
          renderQuizQuestion();
        } else {
          finishQuiz();
        }
      }, 800);
    }

    function finishQuiz() {
      document.getElementById('quiz-modal').classList.add('hidden');
      const room = rooms[currentRoomId];
      const passRate = quizScore / room.quiz.length;

      const transModal = document.getElementById('transition-modal');
      const transTitle = document.getElementById('trans-title');
      const transText = document.getElementById('trans-text');
      const actionBtn = document.getElementById('trans-action-btn');

      if (passRate >= 0.8) {
        transTitle.innerText = "🎉 Quiz Passed!";
        transText.innerText = `Great job, ${playerName}! You passed with ${Math.round(passRate * 100)}% (${quizScore}/${room.quiz.length}). You can now travel to the next room.`;
        actionBtn.innerText = `Go to ${room.nextRoomTitle}`;
        actionBtn.onclick = () => {
          transModal.classList.add('hidden');
          loadRoom(room.nextRoom);
        };
      } else {
        transTitle.innerText = "❌ Try Again";
        transText.innerText = `You scored ${Math.round(passRate * 100)}% (${quizScore}/${room.quiz.length}). You need at least 80% (4/5 correct) to pass and unlock the next room.`;
        actionBtn.innerText = "Retry Quiz";
        actionBtn.onclick = () => {
          transModal.classList.add('hidden');
          startQuiz();
        };
      }

      transModal.classList.remove('hidden');
    }

    // Initialize Game on load
    loadRoom('waiting');
  </script>
</body>
</html>
